<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>헬스 노트</title>
<meta name="description" content="운동 세트, 단백질·칼로리, 체성분을 기록하는 개인 헬스 앱">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: mobile-first single column (max 560px), sticky date header, fixed rest-timer bar + bottom tab bar.
   Color language borrows competition plate colors: blue=protein/accent, yellow=carbs, green=fat, red=over/PR. */
:root {
  --bg: #ECEFF3; --surface: #FFFFFF; --surface-2: #F4F6F9; --line: #D5DBE3;
  --fg: #151B24; --muted: #5B6676;
  --accent: #1F55C9; --accent-ink: #FFFFFF; --accent-soft: #DCE6FA;
  --carb: #B88A00; --fat: #23894B; --warn: #C42B2B; --ok: #23894B; --pr: #C42B2B; --pr-soft: #FBE3E3;
  --font-num: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1217; --surface: #161C24; --surface-2: #1C232D; --line: #2A3340;
    --fg: #E7ECF2; --muted: #93A0B1; --accent: #5B8DF5; --accent-ink: #0B1220; --accent-soft: #1C2A47;
    --carb: #E2B92E; --fat: #42B872; --warn: #EF5B5B; --ok: #42B872; --pr: #FF6B6B; --pr-soft: #3A1E22; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1217; --surface: #161C24; --surface-2: #1C232D; --line: #2A3340;
  --fg: #E7ECF2; --muted: #93A0B1; --accent: #5B8DF5; --accent-ink: #0B1220; --accent-soft: #1C2A47;
  --carb: #E2B92E; --fat: #42B872; --warn: #EF5B5B; --ok: #42B872; --pr: #FF6B6B; --pr-soft: #3A1E22; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.top-in h1 { font-size: 15px; font-weight: 700; margin: 0; flex: 1; min-width: 0; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav .d { font-family: var(--font-num); font-weight: 600; font-size: 19px; min-width: 92px; text-align: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; }
.today-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 34px; padding: 0 10px; cursor: pointer; font-size: 13px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(140px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.banner { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r); padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.banner .grow { flex: 1 1 200px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; }
.rest { background: var(--fg); color: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rest-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding-block: 8px; position: relative; }
.rest-prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); border-radius: 2px; }
.rest-time { font-family: var(--font-num); font-weight: 700; font-size: 26px; min-width: 64px; font-variant-numeric: tabular-nums; }
.rest-label { flex: 1; min-width: 0; font-size: 12px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rest button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; padding: 5px 9px; font-size: 13px; cursor: pointer; opacity: .9; }
.tabs { background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 9px 0 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }

.sec-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 6px 0 -4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-title .lnk { font-weight: 500; letter-spacing: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.stack { display: grid; gap: 8px; }

.kcal-hero { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; }
.kcal-big { font-family: var(--font-num); font-weight: 700; font-size: 56px; line-height: .95; }
.kcal-big.over { color: var(--warn); }
.kcal-big small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); }
.kcal-side b { font-family: var(--font-num); font-size: 18px; color: var(--fg); }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--fg); }
.bar.p > i { background: var(--accent); } .bar.c > i { background: var(--carb); } .bar.f > i { background: var(--fat); }
.bar.over > i { background: var(--warn); }
.metric { display: grid; gap: 6px; }
.metric-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.metric-head b { font-family: var(--font-num); font-size: 22px; font-weight: 600; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.macro { display: grid; gap: 4px; min-width: 0; }
.macro .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.macro .v { font-family: var(--font-num); font-size: 20px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats.s3 { grid-template-columns: repeat(3, 1fr); }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px; min-width: 0; }
.stat .v { font-family: var(--font-num); font-size: 24px; font-weight: 600; line-height: 1.1; }
.stat .k { font-size: 12px; color: var(--muted); }

input[type="text"], input[type="number"], input[inputmode], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.block { width: 100%; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 4px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Session */
.sess { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sess .clock { font-family: var(--font-num); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .live { animation: blink 1.2s infinite; } .bar > i { transition: width .35s ease; } }
@keyframes blink { 50% { opacity: .25; } }

/* Exercise cards */
.ex { display: grid; gap: 10px; }
.ex-head { display: flex; gap: 6px; align-items: center; }
.ex-name { font-weight: 700; font-size: 16px; flex: 1; min-width: 0; border: 0 !important; padding: 2px 0 !important; background: transparent !important; }
.ex-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ex-meta select { width: auto; padding: 3px 6px; font-size: 12px; border-radius: 999px; }
.pill { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.prev { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 34px minmax(0,1fr) minmax(0,1fr) 46px 40px 28px; gap: 5px; align-items: center; }
.set.hdr { font-size: 11px; color: var(--muted); text-align: center; }
.set input { text-align: center; font-family: var(--font-num); font-size: 18px; font-weight: 600; padding: 6px 2px; }
.set input.rpe { font-size: 15px; }
.set input::placeholder { color: var(--muted); opacity: .55; }
.ty { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: var(--font-num); font-weight: 700; font-size: 16px; color: var(--muted); position: relative; }
.ty.W { color: var(--carb); border-color: var(--carb); }
.ty.D { color: var(--accent); border-color: var(--accent); }
.ty .badge { position: absolute; top: -7px; right: -8px; background: var(--pr); color: #fff; font-size: 9px; line-height: 1; padding: 2px 3px; border-radius: 4px; font-family: var(--font-body); }
.chk { width: 40px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; font-weight: 700; }
.chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.x { width: 28px; height: 32px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0; }
.set.done input { background: var(--surface-2); }
.set.isPr input { border-color: var(--pr); background: var(--pr-soft); }
.ex-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.ex-foot b { font-family: var(--font-num); font-size: 16px; color: var(--fg); font-weight: 600; }
.note { font-size: 13px !important; padding: 6px 10px !important; }

/* Foods */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: baseline; max-width: 100%; }
.chip .pp { color: var(--accent); font-family: var(--font-num); font-weight: 600; font-size: 14px; }
.chip.combo { border-style: dashed; }
.meal-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-top: 10px; font-weight: 700; font-size: 14px; flex-wrap: wrap; }
.meal-h:first-child { padding-top: 0; }
.meal-h .sub { font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.food { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.food .name { font-weight: 500; overflow-wrap: anywhere; }
.food .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.food .meta .pv { color: var(--accent); font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 30px; height: 30px; cursor: pointer; }
.stepper span { font-family: var(--font-num); font-weight: 600; min-width: 36px; text-align: center; }
.gram { display: inline-flex; align-items: center; gap: 4px; }
.gram input { width: 64px; text-align: center; font-family: var(--font-num); font-weight: 600; font-size: 16px; padding: 4px; }

/* Charts & calendar */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: 11px; color: var(--muted); padding-bottom: 2px; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; font-family: var(--font-num); font-size: 15px; font-weight: 600; position: relative; padding: 0; color: var(--fg); }
.cal button.out { visibility: hidden; }
.cal button.w1 { background: var(--accent-soft); }
.cal button.w2 { background: var(--accent); color: var(--accent-ink); }
.cal button.today { border-color: var(--fg); }
.cal button .fd { position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--carb); }
.hbar { display: grid; grid-template-columns: 44px 1fr 74px; gap: 8px; align-items: center; font-size: 13px; }
.hbar .track { height: 12px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.hist-row { display: grid; grid-template-columns: 82px repeat(4, minmax(0,1fr)); gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; align-items: baseline; }
.hist-row.hd { cursor: default; font-size: 11px; color: var(--muted); border-top: 0; }
.hist-row .num { font-size: 16px; font-weight: 600; }
.b3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.calc { font-size: 13px; font-variant-numeric: tabular-nums; display: grid; gap: 4px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.calc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 18px 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast.pr { background: var(--pr); color: #fff; font-weight: 700; }
.list-item { display: flex; gap: 8px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 380px) { .kcal-big { font-size: 46px; } .grid4 { grid-template-columns: 1fr 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 id="viewTitle">요약</h1>
    <div class="datenav" id="dateNav">
      <button class="icon-btn" id="prevDay" aria-label="이전 날">‹</button>
      <span class="d" id="dateLabel">—</span>
      <button class="icon-btn" id="nextDay" aria-label="다음 날">›</button>
      <button class="today-btn" id="todayBtn">오늘</button>
    </div>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<div class="dock">
  <div class="rest" id="restBar" hidden>
    <div class="rest-in">
      <i class="rest-prog" id="restProg"></i>
      <span class="rest-time" id="restTime">0:00</span>
      <span class="rest-label" id="restLabel">휴식</span>
      <button id="restMinus" aria-label="15초 줄이기">−15</button>
      <button id="restPlus" aria-label="15초 늘리기">+15</button>
      <button id="restSkip">건너뛰기</button>
    </div>
  </div>
  <nav class="tabs" aria-label="화면">
    <div class="tabs-in">
      <button class="tab" data-tab="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>요약</button>
      <button class="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>운동</button>
      <button class="tab" data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>식단</button>
      <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M7 16V10M12 16V6M17 16v-4"/></svg>기록</button>
      <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>설정</button>
    </div>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json,text/plain" hidden>

<script>
(() => {
"use strict";

/* ================= constants ================= */
const APP_VERSION = "2.0.0";
const LS_KEY = "healthnote.v2";
const LS_TIMER = "healthnote.timer";
const PARTS = ["가슴", "등", "하체", "어깨", "팔", "코어", "기타"];
const LIB = {

  if (clk) { const day = D().days[S.date]; if (day && day.session) clk.textContent = fmtClock(dayStats(day).dur); }
}
setInterval(tick, 250);
$("#restMinus").onclick = () => { if (!timer) return; timer.end = Math.max(Date.now() + 1000, timer.end - 15000); saveTimer(); tick(); };
$("#restPlus").onclick = () => { if (!timer) return; timer.end += 15000; timer.total += 15; saveTimer(); tick(); };
$("#restSkip").onclick = () => { timer = null; saveTimer(); tick(); };

let wakeLock = null;
async function updateWakeLock() {
  const want = D().settings.wakeLock && sessionActive(D().days[todayStr()]) && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && "wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* ================= install prompt ================= */
let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (S.tab === "settings" || S.tab === "summary") requestRender(); });
window.addEventListener("appinstalled", () => { installEvt = null; toast("앱이 설치되었습니다."); requestRender(); });
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

/* ================= rendering ================= */
const $view = $("#view");
let renderDeferred = false;
// Deferred so focus has already moved (a change event fires before the next field gets focus).
function requestRender() {
  setTimeout(() => {
    const a = document.activeElement;
    if (a && $view.contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) { renderDeferred = true; return; }
    render();
  }, 0);
}
$view.addEventListener("focusout", () => { if (renderDeferred) setTimeout(() => { if (renderDeferred) requestRender(); }, 0); });

const TITLES = { summary: "요약", workout: "운동", food: "식단", history: "기록", settings: "설정" };
function render() {
  renderDeferred = false; pbCache = new Map();
  $("#viewTitle").textContent = TITLES[S.tab];
  $("#dateLabel").textContent = fmtDate(S.date);
  $("#todayBtn").hidden = S.date === todayStr();
  $("#dateNav").hidden = S.tab === "history" || S.tab === "settings";
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  let banner = "";
  if (!S.storageOk) banner += `<div class="banner">이 브라우저에서는 기록을 저장할 수 없습니다. 시크릿 모드라면 일반 창에서 열어 주세요.</div>`;
  $view.innerHTML = banner + ({ summary: vSummary, workout: vWorkout, food: vFood, history: vHistory, settings: vSettings }[S.tab])();
  tick(); updateWakeLock();
}
function bar(val, max, cls) {
  const pct = max > 0 ? Math.min(100, val / max * 100) : 0;
  const over = max > 0 && val > max * 1.05 && cls !== "p";
  return `<div class="bar ${cls || ""} ${over ? "over" : ""}"><i style="width:${pct}%"></i></div>`;
}
function backupNag() {
  const days = Object.keys(D().days).filter((d) => hasContent(D().days[d])).length;
  if (days < 3) return "";
  const last = D().lastBackup ? Math.floor((Date.now() - D().lastBackup) / 86400000) : null;
  if (last !== null && last < 14) return "";
  return `<div class="banner"><span class="grow">기록은 이 휴대폰에만 저장됩니다. ${last === null ? "아직 백업한 적이 없습니다." : `마지막 백업이 ${last}일 전입니다.`}</span><button class="btn sm" data-act="goto" data-tab="settings">백업하기</button></div>`;
}

function exCard(ex, date) {

  const prevTxt = prev ? `지난번 ${shortDate(prev.date)}: ${prev.ex.sets.filter((s) => s.kg !== "" || s.reps !== "").map((s) => `${s.t === "W" ? "W " : ""}${num(s.kg)}×${num(s.reps)}`).join(", ")}` : "이 종목 첫 기록";
  const pb = priorBest(ex.name, date);
  const conf = S.confirm === ex.id;
  const part = partOf(ex);
  return `<section class="card ex">
    <div class="ex-head">
      <input class="ex-name" id="n-${ex.id}" value="${esc(ex.name)}" data-bind="exname" data-ex="${ex.id}" aria-label="종목 이름">

      <select id="pt-${ex.id}" data-bind="part" data-ex="${ex.id}" aria-label="운동 부위">${PARTS.map((p) => `<option ${p === part ? "selected" : ""}>${p}</option>`).join("")}</select>
      <button class="pill" data-act="restcycle" data-name="${esc(ex.name)}" aria-label="휴식 시간 바꾸기">휴식 ${restOf(ex.name)}초</button>
      ${pb.e ? `<span class="xs muted">최고 추정 1RM ${r1(pb.e)} kg</span>` : ""}

        <input id="kg-${ex.id}-${i}" inputmode="decimal" value="${s.kg}" placeholder="${ps ? num(ps.kg) || "" : ""}" data-bind="kg" data-ex="${ex.id}" data-i="${i}" aria-label="${i + 1}세트 무게">
        <input id="rp-${ex.id}-${i}" inputmode="numeric" value="${s.reps}" placeholder="${ps ? num(ps.reps) || "" : ""}" data-bind="reps" data-ex="${ex.id}" data-i="${i}" aria-label="${i + 1}세트 횟수">
        <input class="rpe" id="rpe-${ex.id}-${i}" inputmode="decimal" value="${s.rpe}" placeholder="-" data-bind="rpe" data-ex="${ex.id}" data-i="${i}" aria-label="${i + 1}세트 RPE">
        <button class="chk" aria-pressed="${s.done}" data-act="done" data-ex="${ex.id}" data-i="${i}" aria-label="${i + 1}세트 완료">✓</button>
        <button class="x" data-act="delset" data-ex="${ex.id}" data-i="${i}" aria-label="${i + 1}세트 삭제">×</button>
      </div>`; }).join("")}
    </div>
    <div class="row"><button class="btn sm" data-act="addset" data-ex="${ex.id}">+ 세트</button><button class="btn sm ghost" data-act="addwarm" data-ex="${ex.id}">+ 워밍업</button></div>
    <input class="note" id="note-${ex.id}" type="text" value="${esc(ex.note)}" placeholder="메모 (자세, 기구 번호 등)" data-bind="note" data-ex="${ex.id}" aria-label="메모">

function exFoot(st) { return `<span>볼륨 <b>${Math.round(st.vol).toLocaleString()}</b> kg</span><span>최고 <b>${st.top}</b> kg</span><span>추정 1RM <b>${r1(st.best)}</b> kg</span>`; }

    : `<div class="small muted">자주 하는 분할 운동을 루틴으로 저장해 두면 한 번에 불러올 수 있습니다. 종목을 추가한 뒤 위의 "현재 운동을 루틴으로 저장"을 누르세요.</div>`}

}

function barChart(labels, vals, target, color) {
  const W = 340, H = 150, L = 34, R = 6, T = 10, B = 22;
  const max = Math.max(target * 1.15, ...vals, 1);
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const y = (v) => T + (H - T - B) * (1 - v / top), bw = (W - L - R) / vals.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top + 1e-9; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
  vals.forEach((v, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    if (v > 0) s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0) - y(v)}" rx="2" fill="${color}" opacity="${i === vals.length - 1 ? 1 : 0.7}"/>`;
    if (i % 2 === 1 || vals.length <= 7) s += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`;
  });
  if (target > 0) s += `<line x1="${L}" x2="${W - R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  return s + `</svg>`;
}
function lineChart(labels, series, unit) {
  const W = 340, H = 160, L = 38, R = 12, T = 18, B = 22;
  const all = series.flatMap((s) => s.vals);
  let lo = Math.min(...all), hi = Math.max(...all); if (hi - lo < 1) { hi += 1; lo -= 1; }
  const step = niceStep((hi - lo) / 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const n = labels.length, x = (i) => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1)), y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${r1(v)}</text>`;
  const every = Math.ceil(n / 6);
  labels.forEach((lb, i) => { if (i % every === 0 || i === n - 1) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${lb}</text>`; });
  for (const se of series) {
    s += `<polyline fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" points="${se.vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
    const li = se.vals.length - 1; s += `<circle cx="${x(li)}" cy="${y(se.vals[li])}" r="3.5" fill="${se.color}"/>`;
  }
  const last = series[0].vals[series[0].vals.length - 1];
  s += `<text x="${x(n - 1) - 6}" y="${y(last) - 8}" text-anchor="end" style="fill:var(--fg);font-size:12px;font-weight:600">${r1(last)} ${unit}</text>`;
  return s + `</svg>`;
}
function niceStep(raw) { if (raw <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }

function calendar() {
  const [y, m] = S.calMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate(), lead = first.getDay(), today = todayStr();
  let cells = "";
  for (let i = 0; i < lead; i++) cells += `<button class="out" tabindex="-1" aria-hidden="true"></button>`;
  for (let d = 1; d <= daysIn; d++) {
    const key = `${y}-${pad(m)}-${pad(d)}`, day = D().days[key];
    const sets = day ? day.workouts.reduce((a, ex) => a + ex.sets.filter(counts).length, 0) : 0;
    const cls = (sets >= 12 ? "w2" : sets > 0 ? "w1" : "") + (key === today ? " today" : "");
    cells += `<button class="${cls}" data-act="openday" data-d="${key}" aria-label="${m}월 ${d}일${sets ? ` 운동 ${sets}세트` : ""}">${d}${day && day.foods.length ? `<span class="fd"></span>` : ""}</button>`;
  }
  const count = Object.keys(D().days).filter((k) => k.startsWith(S.calMonth) && D().days[k].workouts.some((ex) => ex.sets.some(counts))).length;
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px">
      <button class="icon-btn" data-act="calprev" aria-label="이전 달">‹</button>
      <b class="num" style="font-size:20px">${y}.${pad(m)} <span class="small muted" style="font-family:var(--font-body);font-weight:400">운동 ${count}일</span></b>
      <button class="icon-btn" data-act="calnext" aria-label="다음 달">›</button></div>
    <div class="cal">${"일월화수목금토".split("").map((w) => `<span class="wd">${w}</span>`).join("")}${cells}</div>
    <div class="legend" style="margin-top:8px"><span><span class="dot" style="background:var(--accent-soft);border:1px solid var(--line)"></span>운동</span><span><span class="dot" style="background:var(--accent)"></span>12세트 이상</span><span><span class="dot" style="background:var(--carb)"></span>식단 기록</span></div>`;
}

function vHistory() {

  const exNames = allExerciseNames().sort((a, b) => a.localeCompare(b, "ko"));
  if (!S.histEx || !exNames.includes(S.histEx)) S.histEx = exNames[0] || null;
  let exChart = "";

    const pts = Object.keys(D().days).sort().map((d) => { const ex = D().days[d].workouts.find((e) => e.name === S.histEx); if (!ex) return null; const st = exStats(ex); return st.best ? { d, best: st.best, top: st.top } : null; }).filter(Boolean).slice(-20);
    exChart = pts.length >= 2 ? lineChart(pts.map((p) => shortDate(p.d)), [{ vals: pts.map((p) => p.best), color: "var(--accent)" }, { vals: pts.map((p) => p.top), color: "var(--muted)" }], "kg")

    <div class="xs muted">워밍업을 뺀 완료 세트 기준. 부위는 종목 카드에서 바꿀 수 있습니다.</div>
  </section>
  <div class="sec-title">3대 합계</div>
  <section class="card stack">
    <div class="b3">${b3.map((b) => `<div class="stat"><div class="k">${b.k}</div><div class="v">${b.w || "—"}</div><div class="xs muted">${b.e ? `1RM 추정 ${r1(b.e)}` : "기록 없음"}</div></div>`).join("")}</div>
    <div class="metric-head"><span class="small muted">합계 (최고 중량)</span><span><b>${b3w}</b> kg <span class="small muted">· 추정 1RM 합 ${r1(b3e)} kg</span></span></div>
    <div class="xs muted">종목 이름이 스쿼트·벤치프레스·데드리프트인 기록을 모읍니다.</div>

  <div class="sec-title">종목별 성장</div>
  <section class="card stack">
    ${exNames.length ? `<select id="histEx" data-bind="histex" aria-label="종목 선택">${exNames.map((n) => `<option ${n === S.histEx ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>${exChart}

    : `<div class="empty" style="padding:8px">운동을 기록하면 종목별 추정 1RM 추이가 여기에 표시됩니다.</div>`}
  </section>
  <div class="sec-title">최근 14일 칼로리</div>
  <section class="card">${barChart(dates.map(shortDate), kc, t.kcal, "var(--fg)")}

        <div class="row"><button class="btn primary sm" type="submit">저장</button><button class="btn sm ghost" type="button" data-act="editfood" data-id="">취소</button><span class="grow"></span><button class="btn sm ${S.confirm === f.id ? "danger" : "ghost"}" type="button" data-act="delmy" data-id="${f.id}">${S.confirm === f.id ? "정말 삭제" : "삭제"}</button></div>
      </form>`
      : `<div class="list-item"><div class="grow">${esc(f.name)}<div class="xs muted">${f.basis === "g" ? "100 g당 " : "1회 "}${f.kcal} kcal · <span style="color:var(--accent);font-weight:700">단백질 ${f.p} g</span> · 탄 ${f.c} · 지 ${f.f}</div></div><button class="btn sm ghost" data-act="editfood" data-id="${f.id}">수정</button></div>`).join("") || `<div class="small muted">식단 화면에서 직접 입력한 음식이 여기에 모입니다.</div>`}
  </section>
  <div class="sec-title">백업과 복원</div>
  <section class="card stack">
    <div class="small">기록은 이 휴대폰 브라우저에만 저장됩니다. 휴대폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 저장해 두세요.</div>
    <div class="xs muted">마지막 백업: ${lastB ? `${lastB.getFullYear()}.${pad(lastB.getMonth() + 1)}.${pad(lastB.getDate())}` : "없음"} · 기록 ${Object.keys(D().days).filter((d) => hasContent(D().days[d])).length}일</div>
    <div class="grid2"><button class="btn primary" data-act="export">백업 파일 저장</button><button class="btn" data-act="copybackup">백업 코드 복사</button></div>
    <div class="grid2"><button class="btn" data-act="importfile">백업 파일 열기</button><button class="btn" data-act="togglepaste">${S.showPaste ? "닫기" : "백업 코드 붙여넣기"}</button></div>
    ${S.showPaste ? `<textarea id="pasteBox" placeholder="백업 코드를 여기에 붙여넣으세요"></textarea><button class="btn primary" data-act="readpaste">불러오기</button>` : ""}
    ${imp ? `<div class="banner" style="border-style:solid"><span class="grow">불러온 백업: 기록 ${imp.days}일 · 루틴 ${imp.routines}개 · 내 음식 ${imp.foods}개. 어떻게 적용할까요?</span>
      <div class="row"><button class="btn sm primary" data-act="applyimport" data-mode="merge">합치기</button><button class="btn sm danger" data-act="applyimport" data-mode="replace">전체 교체</button><button class="btn sm ghost" data-act="cancelimport">취소</button></div>
      <div class="xs muted" style="flex-basis:100%">합치기: 같은 날짜는 백업 내용으로 바뀌고 나머지는 유지됩니다. 전체 교체: 지금 기록을 지우고 백업으로 바꿉니다.</div></div>` : ""}
  </section>
  <div class="xs muted" style="text-align:center">헬스 노트 v${APP_VERSION}</div>`;
}

/* ================= actions ================= */
function go(tab) { if (tab === S.tab) return; S.tab = tab; S.confirm = null; history.pushState({ tab }, ""); render(); window.scrollTo(0, 0); }
window.addEventListener("popstate", (e) => { S.tab = (e.state && e.state.tab) || "summary"; S.confirm = null; render(); });
history.replaceState({ tab: S.tab }, "");
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) go(b.dataset.tab); });
$("#prevDay").onclick = () => { S.date = shiftDate(S.date, -1); S.confirm = null; render(); };
$("#nextDay").onclick = () => { S.date = shiftDate(S.date, 1); S.confirm = null; render(); };
$("#todayBtn").onclick = () => { S.date = todayStr(); render(); };

function findEx(id) { return getDay(S.date).workouts.find((e) => e.id === id); }
function addExercise(day, name, setsTemplate) {
  const prev = previousExercise(name, day.date);
  const sets = prev ? prev.ex.sets.map((s) => ({ kg: s.kg, reps: s.reps, t: s.t || "N", rpe: "", done: false, at: null }))
    : (setsTemplate && setsTemplate.length ? setsTemplate.map((s) => ({ kg: s.kg ?? "", reps: s.reps ?? "", t: s.t || "N", rpe: "", done: false, at: null })) : [{ kg: "", reps: "", t: "N", rpe: "", done: false, at: null }]);
  day.workouts.push({ id: uid(), name, part: null, note: "", sets });
  return prev;
}
function download(name, text) {
  const blob = new Blob([text], { type: "application/json" }), url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
function backupText() { return JSON.stringify({ app: "health-note", v: 2, exportedAt: new Date().toISOString(), data: D() }); }
function stageImport(text) {
  try {
    const data = migrate(JSON.parse(text.trim()));
    S.pendingImport = { data, days: Object.keys(data.days).filter((d) => hasContent(data.days[d])).length, routines: data.routines.length, foods: data.myFoods.length };
    S.showPaste = false;
  } catch (e) { toast("불러올 수 없습니다: " + (e.message || "형식 오류")); }
  render();
}

$view.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, day = getDay(S.date);
  if (!["delex", "delmy", "delroutine", "delcombo"].includes(act)) S.confirm = null;
  switch (act) {
    case "goto": go(b.dataset.tab); return;
    case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } return;
    case "startsess": day.session = { start: Date.now(), end: null }; break;
    case "endsess": if (day.session) day.session.end = Date.now(); timer = null; saveTimer(); toast(`운동 종료 · ${fmtDur(dayStats(day).dur)}`); break;
    case "resumesess": if (day.session) day.session.end = null; break;
    case "addset": case "addwarm": {
      const ex = findEx(b.dataset.ex), warm = act === "addwarm";
      const ref = [...ex.sets].reverse().find((s) => s.t !== "W");
      if (warm) ex.sets.splice(ex.sets.filter((s) => s.t === "W").length, 0, { kg: ref && ref.kg ? Math.round(num(ref.kg) * 0.5 / 2.5) * 2.5 : "", reps: 10, t: "W", rpe: "", done: false, at: null });
      else { const last = ex.sets[ex.sets.length - 1]; ex.sets.push({ kg: last ? last.kg : "", reps: last ? last.reps : "", t: last && last.t === "D" ? "D" : "N", rpe: "", done: false, at: null }); }
      break;
    }
    case "delset": findEx(b.dataset.ex).sets.splice(+b.dataset.i, 1); break;
    case "type": { const s = findEx(b.dataset.ex).sets[+b.dataset.i]; s.t = s.t === "N" ? "W" : s.t === "W" ? "D" : "N"; break; }
    case "done": {
      const ex = findEx(b.dataset.ex), i = +b.dataset.i, s = ex.sets[i];
      s.done = !s.done; s.at = s.done ? Date.now() : null;
      if (s.done) {
        if (s.kg === "" && s.reps === "") { const prev = previousExercise(ex.name, S.date); const ps = prev && prev.ex.sets[i]; if (ps) { s.kg = ps.kg; s.reps = ps.reps; } }
        if (S.date === todayStr() && !day.session) day.session = { start: Date.now(), end: null };
        if (S.date === todayStr() && day.session && day.session.end) day.session.end = null;
        pbCache = new Map();
        const f = prFlags(ex, S.date)[i];
        if (f) toast(`신기록! ${ex.name} ${f.includes("w") ? `최고 중량 ${num(s.kg)} kg` : `추정 1RM ${r1(e1rm(s.kg, s.reps))} kg`}`, true);
        if (S.date === todayStr()) startRest(s.t === "W" ? Math.min(60, restOf(ex.name)) : restOf(ex.name), `${ex.name} ${i + 1}세트 후`);
      }
      break;
    }
    case "restcycle": { const n = b.dataset.name, cur = restOf(n), nx = REST_STEPS.find((v) => v > cur) || REST_STEPS[0]; D().exRest[n] = nx; break; }
    case "delex": { const id = b.dataset.ex; if (S.confirm === id) { day.workouts = day.workouts.filter((x) => x.id !== id); S.confirm = null; } else { S.confirm = id; render(); return; } break; }
    case "copyprev": { const src = D().days[b.dataset.from]; for (const ex of src.workouts) day.workouts.push({ id: uid(), name: ex.name, part: ex.part, note: "", sets: ex.sets.map((s) => ({ kg: s.kg, reps: s.reps, t: s.t, rpe: "", done: false, at: null })) }); toast(`${shortDate(b.dataset.from)} 운동을 불러왔습니다.`); break; }
    case "saveroutine": S.saveRoutine = !S.saveRoutine; render(); if (S.saveRoutine) setTimeout(() => { const el = $("#routineName"); if (el) el.focus(); }, 0); return;
    case "startroutine": { const r = D().routines.find((x) => x.id === b.dataset.id); for (const it of r.items) { addExercise(day, it.name, it.sets); const last = day.workouts[day.workouts.length - 1]; if (it.part) last.part = it.part; } toast(`${r.name} 루틴 ${r.items.length}종목을 추가했습니다.`); break; }
    case "delroutine": { const id = b.dataset.id; if (S.confirm === id) { D().routines = D().routines.filter((x) => x.id !== id); S.confirm = null; } else { S.confirm = id; render(); return; } break; }
    case "meal": S.meal = b.dataset.meal; render(); return;
    case "fbasis": S.fBasis = b.dataset.b; render(); return;
    case "quick": {
      const f = D().myFoods.find((x) => x.id === b.dataset.id);
      if (f.basis === "g") { day.foods.push(normFoodEntry({ ref: f.id, name: f.name, meal: S.meal, basis: "g", kcal: f.kcal, p: f.p, c: f.c, f: f.f, g: f.lastG || 100 })); toast(`${f.name} ${f.lastG || 100} g 추가 · 단백질 ${r1(f.p * (f.lastG || 100) / 100)} g`); }
      else { const ex = day.foods.find((x) => x.ref === f.id && x.meal === S.meal && x.basis === "sv"); if (ex) ex.qty = num(ex.qty) + 1; else day.foods.push(normFoodEntry({ ref: f.id, name: f.name, meal: S.meal, basis: "sv", kcal: f.kcal, p: f.p, c: f.c, f: f.f, qty: 1 })); toast(`${f.name} 추가 · 단백질 ${f.p} g`); }
      break;
    }
    case "addcombo": { const m = D().myMeals.find((x) => x.id === b.dataset.id); for (const it of m.items) day.foods.push(normFoodEntry({ ...it, id: uid(), meal: S.meal })); toast(`${m.name} 추가 · 단백질 ${r1(foodTotals(m.items).p)} g`); break; }
    case "delcombo": { const id = b.dataset.id; if (S.confirm === id) { D().myMeals = D().myMeals.filter((x) => x.id !== id); S.confirm = null; } else { S.confirm = id; render(); return; } break; }
    case "savemeal": S.saveMeal = S.saveMeal === b.dataset.meal ? null : b.dataset.meal; render(); if (S.saveMeal) setTimeout(() => { const el = document.getElementById("mealName-" + S.saveMeal); if (el) el.focus(); }, 0); return;
    case "qty": { const x = day.foods.find((y) => y.id === b.dataset.id); x.qty = Math.max(0.5, r1(num(x.qty) + num(b.dataset.d))); break; }
    case "delfood": day.foods = day.foods.filter((x) => x.id !== b.dataset.id); break;
    case "editfood": S.editFood = b.dataset.id || null; S.efBasis = null; render(); return;
    case "efbasis": S.efBasis = b.dataset.b; render(); return;
    case "delmy": { const id = b.dataset.id; if (S.confirm === id) { D().myFoods = D().myFoods.filter((x) => x.id !== id); S.confirm = null; S.editFood = null; } else { S.confirm = id; render(); return; } break; }
    case "openday": S.date = b.dataset.d; go("summary"); return;
    case "calprev": case "calnext": { const [y, m] = S.calMonth.split("-").map(Number); const t = new Date(y, m - 1 + (act === "calnext" ? 1 : -1), 1); S.calMonth = `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; render(); return; }
    case "bodymetric": S.bodyMetric = b.dataset.k; render(); return;
    case "export": { const d = new Date(); download(`health-note-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`, backupText()); D().lastBackup = Date.now(); toast("백업 파일을 저장했습니다. 다운로드 폴더를 확인하세요."); break; }
    case "copybackup": {
      const text = backupText();
      const done = () => { D().lastBackup = Date.now(); save(); toast("백업 코드를 복사했습니다. 메모 앱이나 카톡 나와의 채팅에 붙여넣어 두세요."); render(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast("복사하지 못했습니다. 백업 파일 저장을 이용해 주세요."));
      else toast("복사하지 못했습니다. 백업 파일 저장을 이용해 주세요.");
      return;
    }
    case "importfile": $("#importFile").click(); return;
    case "togglepaste": S.showPaste = !S.showPaste; render(); return;
    case "readpaste": stageImport(($("#pasteBox") || {}).value || ""); return;
    case "cancelimport": S.pendingImport = null; render(); return;
    case "applyimport": {
      const inc = S.pendingImport.data;
      if (b.dataset.mode === "replace") S.data = inc;
      else {
        for (const [k, v] of Object.entries(inc.days)) if (hasContent(v)) D().days[k] = v;
        const ids = (arr) => new Set(arr.map((x) => x.id)), names = (arr) => new Set(arr.map((x) => x.name));
        const rIds = ids(D().routines); inc.routines.forEach((r) => { if (!rIds.has(r.id)) D().routines.push(r); });
        const fIds = ids(D().myFoods), fNames = names(D().myFoods); inc.myFoods.forEach((f) => { if (!fIds.has(f.id) && !fNames.has(f.name)) D().myFoods.push(f); });
        const mIds = ids(D().myMeals); inc.myMeals.forEach((m) => { if (!mIds.has(m.id)) D().myMeals.push(m); });
        Object.assign(D().exParts, inc.exParts); Object.assign(D().exRest, inc.exRest);
        if (!Object.keys(D().days).length) D().settings = inc.settings;
      }
      S.pendingImport = null; flush(); toast("백업을 적용했습니다."); render(); return;
    }
  }
  pbCache = new Map(); save(); render();
});

$("#importFile").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => stageImport(String(rd.result || "")); rd.onerror = () => toast("파일을 읽지 못했습니다."); rd.readAsText(f);
  e.target.value = "";
});

$view.addEventListener("input", (e) => {
  const el = e.target, bind = el.dataset.bind; if (!bind) return;
  const day = getDay(S.date);
  if (bind === "kg" || bind === "reps" || bind === "rpe") {
    const ex = findEx(el.dataset.ex); ex.sets[+el.dataset.i][bind] = el.value.trim() === "" ? "" : num(el.value);
    const foot = document.getElementById("foot-" + ex.id); if (foot) foot.innerHTML = exFoot(exStats(ex));
    save();
  } else if (bind === "exname") { findEx(el.dataset.ex).name = el.value; save(); }
  else if (bind === "note") { findEx(el.dataset.ex).note = el.value; save(); }
  else if (bind === "body") { day.body[el.dataset.k] = el.value.trim() === "" ? null : num(el.value); save(); }
  else if (bind === "grams") { const x = day.foods.find((y) => y.id === el.dataset.id); x.g = num(el.value); const f = D().myFoods.find((m) => m.id === x.ref); if (f && x.g > 0) f.lastG = x.g; const k = factor(x), m = document.getElementById("meta-" + x.id); if (m) m.innerHTML = `${Math.round(x.kcal * k)} kcal · <span class="pv">단백질 ${r1(x.p * k)} g</span> · 탄 ${r1(x.c * k)} · 지 ${r1(x.f * k)}`; save(); }
});
$view.addEventListener("change", (e) => {
  const el = e.target, bind = el.dataset.bind; if (!bind) return;
  if (bind === "set") {
    const k = el.dataset.k; let v = el.value;
    if (k === "kcalOverride") v = v.trim() === "" ? null : num(v); else if (k !== "sex") v = num(v);
    D().settings[k] = v; save(); el.tagName === "SELECT" ? render() : requestRender();
  } else if (bind === "flag") { D().settings[el.dataset.k] = el.checked; save(); render(); }
  else if (bind === "part") { const ex = findEx(el.dataset.ex); ex.part = el.value; D().exParts[ex.name] = el.value; save(); render(); }
  else if (bind === "histex") { S.histEx = el.value; render(); }
  else if (bind === "exname") { const ex = findEx(el.dataset.ex); ex.name = el.value.trim() || "이름 없는 종목"; save(); requestRender(); }
});
$view.addEventListener("submit", (e) => {
  e.preventDefault();
  const day = getDay(S.date), form = e.target, val = (id) => (document.getElementById(id) || {}).value || "";
  if (form.id === "addExForm") {
    const name = val("exInput").trim(); if (!name) return;
    const prev = addExercise(day, name);
    if (prev) toast(`지난 ${shortDate(prev.date)} 세트를 미리 채웠습니다.`);
  } else if (form.id === "routineForm") {
    const name = val("routineName").trim(); if (!name) return;
    const items = day.workouts.map((ex) => ({ name: ex.name, part: ex.part, sets: ex.sets.map((s) => ({ kg: s.kg, reps: s.reps, t: s.t })) }));
    const old = D().routines.find((r) => r.name === name);
    if (old) old.items = items; else D().routines.push({ id: uid(), name, items });
    S.saveRoutine = false; toast(`루틴 "${name}"을 ${old ? "덮어썼습니다" : "저장했습니다"}.`);
  } else if (form.classList.contains("mealForm")) {
    const mk = form.dataset.meal, name = val("mealName-" + mk).trim(); if (!name) return;
    D().myMeals.push({ id: uid(), name, items: day.foods.filter((x) => x.meal === mk).map((x) => normFoodEntry({ ...x, id: uid() })) });
    S.saveMeal = null; toast(`"${name}"을 내 식사로 저장했습니다.`);
  } else if (form.id === "addFoodForm") {
    const name = val("fName").trim(); if (!name) return;
    const basis = S.fBasis === "g" ? "g" : "sv";
    const item = { name, basis, kcal: num(val("fKcal")), p: num(val("fP")), c: num(val("fC")), f: num(val("fF")) };
    const g = basis === "g" ? (num(val("fG")) || 100) : null, ref = uid();
    if (document.getElementById("fSave").checked) D().myFoods.push(normMyFood({ id: ref, ...item, lastG: g || undefined }));
    day.foods.push(normFoodEntry({ ref, ...item, meal: S.meal, qty: 1, g })); toast(`${name} 추가`);
  } else if (form.classList.contains("editFood")) {
    const f = D().myFoods.find((x) => x.id === form.dataset.id);
    Object.assign(f, normMyFood({ id: f.id, name: val("ef-name").trim() || f.name, basis: S.efBasis || f.basis, kcal: val("ef-k"), p: val("ef-p"), c: val("ef-c"), f: val("ef-f"), lastG: f.lastG }));
    S.editFood = null; S.efBasis = null; toast("내 음식을 수정했습니다. 이미 기록한 날짜에는 반영되지 않습니다.");
  }
  pbCache = new Map(); save(); render();
});

/* ================= boot ================= */
load();
render();
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
window.__hn = { S, migrate, targets, prFlags, foodTotals, guessPart, partWeek, bestOf }; // test hook
})();
</script>
</body>
