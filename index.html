<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>헬스 노트</title>
<meta name="description" content="운동 세트, 단백질·칼로리, 체성분을 기록하는 개인 헬스 앱">
<meta name="theme-color" content="#FFF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E0E17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: mobile-first single column (max 560px), sticky date header, floating bottom tab bar.
   Look: strawberry-milk pink, rounded sticker cards, chunky pill buttons. Semantic colors stay separate from the pink accent:
   mint = done/recovered, butter = caution/cardio, coral = low/over, violet = personal records. */
:root {
  --bg: #FFF0F5; --surface: #FFFFFF; --surface-2: #FFE6EE; --line: #F7C9D9;
  --fg: #3B1830; --muted: #8A5E72;
  --accent: #DB2C6F; --accent-ink: #FFFFFF; --accent-soft: #FFD6E4; --accent-deep: #A8174F; --accent-text: #B01A55;
  --carb: #A66C00; --fat: #0B7F5D; --warn: #D6363B; --ok: #0B7F5D; --pr: #7C4DEB; --pr-soft: #EFE6FF; --pr-ink: #FFFFFF;
  --shadow: 0 6px 18px rgba(219, 44, 111, .10);
  --font-num: "Fredoka", "Jua", system-ui, sans-serif;
  --font-display: "Jua", "Fredoka", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E0E17; --surface: #2A1521; --surface-2: #36192A; --line: #522B3F;
    --fg: #FFE8F0; --muted: #D0A0B5; --accent: #FF85B0; --accent-ink: #33091C; --accent-soft: #4D1E35; --accent-deep: #B8456F; --accent-text: #FF85B0;
    --carb: #F5C445; --fat: #4FD6A8; --warn: #FF7A7A; --ok: #4FD6A8; --pr: #B99AFF; --pr-soft: #32254F; --pr-ink: #1E0E17;
    --shadow: 0 6px 18px rgba(0, 0, 0, .28); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E0E17; --surface: #2A1521; --surface-2: #36192A; --line: #522B3F;
  --fg: #FFE8F0; --muted: #D0A0B5; --accent: #FF85B0; --accent-ink: #33091C; --accent-soft: #4D1E35; --accent-deep: #B8456F; --accent-text: #FF85B0;
  --carb: #F5C445; --fat: #4FD6A8; --warn: #FF7A7A; --ok: #4FD6A8; --pr: #B99AFF; --pr-soft: #32254F; --pr-ink: #1E0E17;
  --shadow: 0 6px 18px rgba(0, 0, 0, .28); color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.top-in h1 { font-size: 15px; font-weight: 700; margin: 0; flex: 1; min-width: 0; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav .d { font-family: var(--font-num); font-weight: 600; font-size: 19px; min-width: 92px; text-align: center; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; }
.today-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 34px; padding: 0 10px; cursor: pointer; font-size: 13px; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.banner { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r); padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.banner .grow { flex: 1 1 200px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; }
.tabs { background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tab { background: none; border: 0; padding: 9px 0 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 700; }

.sec-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 6px 0 -4px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-title .lnk { font-weight: 500; letter-spacing: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.stack { display: grid; gap: 8px; }

.kcal-hero { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; }
.kcal-big { font-family: var(--font-num); font-weight: 700; font-size: 56px; line-height: .95; }
.kcal-big.over { color: var(--warn); }
.kcal-big small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--muted); }
.kcal-side b { font-family: var(--font-num); font-size: 18px; color: var(--fg); }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--fg); }
.bar.p > i { background: var(--accent); } .bar.c > i { background: var(--carb); } .bar.f > i { background: var(--fat); }
.bar.over > i { background: var(--warn); }
.metric { display: grid; gap: 6px; }
.metric-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.metric-head b { font-family: var(--font-num); font-size: 22px; font-weight: 600; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.macro { display: grid; gap: 4px; min-width: 0; }
.macro .k { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.macro .v { font-family: var(--font-num); font-size: 20px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats.s3 { grid-template-columns: repeat(3, 1fr); }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px; min-width: 0; }
.stat .v { font-family: var(--font-num); font-size: 24px; font-weight: 600; line-height: 1.1; }
.stat .k { font-size: 12px; color: var(--muted); }

input[type="text"], input[type="number"], input[inputmode], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); border-color: var(--warn); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.block { width: 100%; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 4px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Session */
.sess { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sess .clock { font-family: var(--font-num); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .live { animation: blink 1.2s infinite; } .bar > i { transition: width .35s ease; } }
@keyframes blink { 50% { opacity: .25; } }

/* Exercise cards */
.ex { display: grid; gap: 10px; }
.ex-head { display: flex; gap: 6px; align-items: center; }
.ex-name { font-weight: 700; font-size: 16px; flex: 1; min-width: 0; border: 0 !important; padding: 2px 0 !important; background: transparent !important; }
.ex-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ex-meta select { width: auto; padding: 3px 6px; font-size: 12px; border-radius: 999px; }
.pill { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
.prev { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 34px minmax(0,1fr) minmax(0,1fr) 46px 40px 28px; gap: 5px; align-items: center; }
.set.hdr { font-size: 11px; color: var(--muted); text-align: center; }
.set input { text-align: center; font-family: var(--font-num); font-size: 18px; font-weight: 600; padding: 6px 2px; }
.set input.rpe { font-size: 15px; }
.set input::placeholder { color: var(--muted); opacity: .55; }
.ty { height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: var(--font-num); font-weight: 700; font-size: 16px; color: var(--muted); position: relative; }
.ty.W { color: var(--carb); border-color: var(--carb); }
.ty.D { color: var(--accent); border-color: var(--accent); }
.ty .badge { position: absolute; top: -7px; right: -8px; background: var(--pr); color: #fff; font-size: 9px; line-height: 1; padding: 2px 3px; border-radius: 4px; font-family: var(--font-body); }
.chk { width: 40px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; font-weight: 700; }
.chk[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.x { width: 28px; height: 32px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0; }
.set.done input { background: var(--surface-2); }
.set.isPr input { border-color: var(--pr); background: var(--pr-soft); }
.ex-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.ex-foot b { font-family: var(--font-num); font-size: 16px; color: var(--fg); font-weight: 600; }
.note { font-size: 13px !important; padding: 6px 10px !important; }

/* Foods */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: baseline; max-width: 100%; }
.chip .pp { color: var(--accent); font-family: var(--font-num); font-weight: 600; font-size: 14px; }
.chip.combo { border-style: dashed; }
.meal-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-top: 10px; font-weight: 700; font-size: 14px; flex-wrap: wrap; }
.meal-h:first-child { padding-top: 0; }
.meal-h .sub { font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.food { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.food .name { font-weight: 500; overflow-wrap: anywhere; }
.food .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.food .meta .pv { color: var(--accent); font-weight: 700; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 30px; height: 30px; cursor: pointer; }
.stepper span { font-family: var(--font-num); font-weight: 600; min-width: 36px; text-align: center; }
.gram { display: inline-flex; align-items: center; gap: 4px; }
.gram input { width: 64px; text-align: center; font-family: var(--font-num); font-weight: 600; font-size: 16px; padding: 4px; }

/* Charts & calendar */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .wd { font-size: 11px; color: var(--muted); padding-bottom: 2px; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; font-family: var(--font-num); font-size: 15px; font-weight: 600; position: relative; padding: 0; color: var(--fg); }
.cal button.out { visibility: hidden; }
.cal button.w1 { background: var(--accent-soft); }
.cal button.w2 { background: var(--accent); color: var(--accent-ink); }
.cal button.today { border-color: var(--fg); }
.cal button .fd { position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--carb); }
.hbar { display: grid; grid-template-columns: 44px 1fr 74px; gap: 8px; align-items: center; font-size: 13px; }
.hbar .track { height: 12px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.hist-row { display: grid; grid-template-columns: 82px repeat(4, minmax(0,1fr)); gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; align-items: baseline; }
.hist-row.hd { cursor: default; font-size: 11px; color: var(--muted); border-top: 0; }
.hist-row .num { font-size: 16px; font-weight: 600; }
.b3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.calc { font-size: 13px; font-variant-numeric: tabular-nums; display: grid; gap: 4px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.calc code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 18px 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast.pr { background: var(--pr); color: #fff; font-weight: 700; }
.list-item { display: flex; gap: 8px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 380px) { .kcal-big { font-size: 46px; } .grid4 { grid-template-columns: 1fr 1fr; } .stats { grid-template-columns: repeat(2, 1fr); } }

/* v3 additions */
.icon-btn.sm { width: 30px; height: 30px; font-size: 14px; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.ex-title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.ex.sup { border-left: 4px solid var(--accent); }
.sup-tag { background: var(--accent); color: var(--accent-ink); font-family: var(--font-num); font-weight: 700; font-size: 14px; border-radius: 6px; padding: 2px 7px; flex: none; }
.set.k-wr, .set.k-bwp, .set.k-bwa { grid-template-columns: 34px minmax(0,1fr) minmax(0,1fr) 46px 40px 28px; }
.set.k-bw { grid-template-columns: 34px minmax(0,1fr) 46px 40px 28px; }
.set.k-time { grid-template-columns: 34px minmax(0,1fr) 40px 28px; }
.set.k-dist { grid-template-columns: 34px minmax(0,1fr) minmax(0,1fr) 40px 28px; }
.macros.two { grid-template-columns: 1fr 1fr; }
/* v3.1: home plan, week strip, recovery, diary */
.plan-title { font-size: 26px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.btn.big { padding: 13px 12px; font-size: 16px; font-weight: 700; }
.runrow { border-top: 1px solid var(--line); padding-top: 10px; }
.okmark { color: var(--ok); font-weight: 700; font-size: 14px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wk { position: relative; display: grid; gap: 1px; justify-items: center; padding: 6px 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--fg); cursor: pointer; min-width: 0; }
.wk:disabled { cursor: default; opacity: 1; }
.wk .wd { font-size: 11px; color: var(--muted); }
.wk .pt { font-size: 13px; font-weight: 700; white-space: nowrap; }
.wk .mk { font-family: var(--font-num); font-size: 15px; font-weight: 700; height: 18px; line-height: 18px; }
.wk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wk.on .wd { color: var(--accent-ink); opacity: .8; }
.wk.today { outline: 2px solid var(--fg); outline-offset: 1px; }
.rn { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--carb); display: inline-block; }
.hbar .track i.lo { background: var(--warn); } .hbar .track i.mid { background: var(--carb); } .hbar .track i.hi { background: var(--ok); }
.recent { display: grid; gap: 4px; text-align: left; width: 100%; cursor: pointer; color: var(--fg); }
.back { justify-self: start; align-self: flex-start; }
.linkish { display: flex; gap: 8px; align-items: center; width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-size: 16px; color: var(--fg); }
button.ex-title { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--fg); }
.dsets { display: flex; flex-wrap: wrap; gap: 5px; }
.dset { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
.dset i { font-style: normal; color: var(--carb); margin-right: 4px; font-size: 13px; }
.dset em { font-style: normal; font-family: var(--font-body); font-size: 11px; font-weight: 400; color: var(--muted); }
.dset.skip { opacity: .45; }
.dset.pr { border-color: var(--pr); background: var(--pr-soft); }
.hrow { display: grid; gap: 6px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 0; cursor: pointer; color: var(--fg); }
.hrow:first-child { border-top: 0; padding-top: 0; }
.stats.recs { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.sched { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.ty.F { color: var(--warn); border-color: var(--warn); }
.rec { display: flex; gap: 8px; align-items: center; background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.rec.up b { color: var(--accent); }
.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tools { gap: 6px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.picklist { display: grid; gap: 4px; max-height: 340px; overflow-y: auto; }
.pick { display: flex; gap: 8px; align-items: baseline; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; cursor: pointer; }
.pick:hover { border-color: var(--accent); }
input[type="search"] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }

/* ===== v3.2 pink skin (overrides) ===== */
.top { border-bottom: 0; }
.top-in h1 { font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--accent-text); }
.datenav .d { font-weight: 600; font-size: 17px; }
.icon-btn, .today-btn { border-radius: 999px; border-width: 1.5px; }
main { padding-block: 8px calc(112px + env(safe-area-inset-bottom, 0px)); }
.card { border-width: 1.5px; padding: 16px; box-shadow: var(--shadow); }
.banner { border-radius: 16px; border-width: 1.5px; }
.sec-title { font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0; color: var(--fg); margin: 8px 4px -6px; }
.sec-title .lnk { font-family: var(--font-body); font-size: 12px; color: var(--muted); }
.btn { border-radius: 999px; border-width: 1.5px; padding: 8px 14px; }
.btn.sm { padding: 5px 11px; }
.btn.primary { font-family: var(--font-display); font-weight: 400; font-size: 16px; box-shadow: 0 4px 0 var(--accent-deep); margin-bottom: 4px; }
.btn.primary.sm { font-size: 14px; box-shadow: 0 3px 0 var(--accent-deep); margin-bottom: 3px; }
.btn.big { padding: 14px 12px; font-size: 20px; }
.btn[aria-pressed="true"] { color: var(--accent-text); }
input[type="text"], input[type="number"], input[inputmode], input[type="search"], select, textarea { border-radius: 12px; border-width: 1.5px; }
input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline-color: var(--accent); }
.stat { border-radius: 14px; padding: 10px 6px; text-align: center; }
.stat .v { font-size: 21px; }
.bar { height: 12px; border-width: 1.5px; }
.seg { border-radius: 999px; border-width: 1.5px; }
.chip { border-width: 1.5px; }
.chip.on { font-weight: 700; }
.ty, .chk { border-radius: 12px; border-width: 1.5px; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ty .badge, .toast.pr { color: var(--pr-ink); }
.rec, .panel, .calc { border-radius: 14px; }
.rec.up b { color: var(--accent-text); }
.pick { border-radius: 14px; border-width: 1.5px; }
.dset { border-radius: 999px; padding: 2px 10px; border-width: 1.5px; }
.sup-tag { border-radius: 999px; }
.ex.sup { border-left-width: 6px; }
button.ex-title, .ex-title { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.plan-title { font-family: var(--font-display); font-weight: 400; font-size: 30px; }
.wk { border-radius: 14px; border-width: 1.5px; padding: 7px 0 8px; }
.wk .mk { font-size: 15px; font-family: var(--font-body); }
.wk.today { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.hbar .track { height: 14px; border-radius: 999px; }
.hbar .track i { border-radius: 999px; }
.cal button { border-radius: 50%; }
.cal button.today { border: 2px solid var(--accent); }
.stepper { border-radius: 999px; border-width: 1.5px; }
.hist-row .num { font-size: 15px; }
.toast { border-radius: 999px; padding: 10px 18px; font-size: 14px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); text-align: center; }
/* bar fills are brighter than the text versions of the same colors */
:root { --fill-ok: #3CCFA0; --fill-mid: #FFC94D; --fill-lo: #FF6B7A; }
.hbar .track i.hi { background: var(--fill-ok); } .hbar .track i.mid { background: var(--fill-mid); } .hbar .track i.lo { background: var(--fill-lo); }
.rn, .cal button .fd { background: var(--fill-mid); }
.bar.c > i { background: var(--fill-mid); }
/* floating tab bar */
.dock { padding: 0 max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.tabs { pointer-events: auto; max-width: 560px; margin: 0 auto; padding: 5px 6px; border: 1.5px solid var(--line); border-radius: 28px; box-shadow: 0 8px 24px rgba(59, 24, 48, .16); }
.tab { padding: 7px 0 6px; border-radius: 22px; font-family: var(--font-display); font-weight: 400; font-size: 13px; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 400; }
/* home mascot */
.plan { background: linear-gradient(165deg, var(--surface) 50%, var(--accent-soft)); }
.plan-head { display: flex; gap: 10px; align-items: center; }
.mascot { width: 96px; height: auto; flex: none; }
.bubble { justify-self: start; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 5px 10px; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) {
  .btn { transition: transform .08s ease, box-shadow .08s ease; }
  .btn:active { transform: translateY(2px); }
  .btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-deep); }
  .mascot { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
  .chk.pop { animation: pop .38s ease; }
  .tab[aria-current="page"] svg { animation: pop .3s ease; }
}
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
</style>
</head>

<header class="top">
  <div class="top-in">
    <h1 id="viewTitle">홈</h1>

      <button class="icon-btn" id="prevDay" aria-label="이전 날">‹</button>
      <span class="d" id="dateLabel">—</span>
      <button class="icon-btn" id="nextDay" aria-label="다음 날">›</button>

  </div>

<main><div class="wrap" id="view"></div></main>

  <nav class="tabs" aria-label="화면">

      <button class="tab" data-tab="summary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
      <button class="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>운동</button>
      <button class="tab" data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>식단</button>
      <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M7 16V10M12 16V6M17 16v-4"/></svg>기록</button>
      <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>설정</button>
    </div>
  </nav>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json,text/plain" hidden>
